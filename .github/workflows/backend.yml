name: Backend — checks and deployment
on:
  push:
    branches: [codex/backend-hosting-2.5.1, codex/server-optimization]
  pull_request:
    branches: [main, codex/build-android-apk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: movement-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/codex/server-optimization' }}
jobs:
  signing_probe:
    if: contains(github.event.head_commit.message, '[signing-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        with:
          path: |
            work/gradle/caches
            work/gradle/wrapper
            ~/.android/debug.keystore
          key: movement-staging-android-v1-${{ runner.os }}
      - name: Inspect public debug certificate metadata only
        run: |
          for candidate in "$HOME/.android/debug.keystore" work/android-user/debug.keystore; do
            if [ -f "$candidate" ]; then
              echo "Certificate metadata: $candidate"
              keytool -list -keystore "$candidate" -storepass android -alias androiddebugkey
            else
              echo "Keystore absent: $candidate"
            fi
          done
          find work/gradle/caches -type f \( -name '*.keystore' -o -name '*.jks' \) -print || true
  check:
    if: ${{ !contains(github.event.head_commit.message, '[signing-probe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run backend:validate
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save playwright-core@1.58.2
      - name: Check all browser scenarios in isolated cookie and device fixtures
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          TESTSERVERPORT: '4185'
        run: npm run test:browser:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            work/diagnostics-*.png
            work/browser-ci.log
  android:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/server-optimization'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            work/gradle/caches
            work/gradle/wrapper
            ~/.android/debug.keystore
          key: movement-staging-android-v1-${{ runner.os }}
      - run: npm ci
      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build independently installable staging APK
        run: npm run build:apk:staging
        env:
          VITE_API_BASE_URL: https://movement-test-api-staging.rojoscarlos93.workers.dev/api
      - uses: actions/upload-artifact@v4
        with:
          name: movement-2.5.3-staging-apk
          path: work/artifacts/*
      - name: Publish test APK on the implementation branch
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app-debug.apk public/app-debug.apk.json public/app-debug.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish isolated 2.5.3 staging APK [skip ci]'
            git push origin HEAD:codex/server-optimization
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/server-optimization'
    needs: [check, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.android.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy isolated staging Worker and D1 and verify
        run: npm run backend:deploy
        env:
          BACKEND_TARGET: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-deployment
          path: work/backend/deployment.json
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/backend-hosting-2.5.1'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. See docs/CLOUDFLARE_SETUP.md.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Provision D1, migrate, deploy and verify
        run: npm run backend:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-deployment
          path: work/backend/deployment.json

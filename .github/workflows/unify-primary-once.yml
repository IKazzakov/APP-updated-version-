name: Movement — consolidate primary backend

on:
  push:
    branches: [main]
    paths: [.github/release-requests/unify-primary.json]

permissions:
  contents: read

concurrency:
  group: movement-deploy
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check the explicit deployment request
        env:
          CONFIRMATION: deploy
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$CONFIRMATION" = deploy || { echo '::error::Enter deploy to confirm publication.'; exit 1; }
          if [ "$SOURCE_REF" != refs/heads/main ]; then
            echo '::error::The canonical server must be deployed from main.'
            exit 1
          fi
  check:
    needs: authorize
    uses: ./.github/workflows/checks.yml
  android:
    needs: check
    uses: ./.github/workflows/android.yml
    secrets:
      STAGING_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAGING_ANDROID_KEYSTORE_BASE64 }}
  identity_import:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve the legacy profile and sessions in the primary database
        run: node scripts/consolidate-legacy-identities.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-identity-import
          path: work/server-consolidation/identity-import.json
          if-no-files-found: error
  deploy:
    needs: identity_import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository. See docs/CLOUDFLARE_SETUP.md.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: movement-android-${{ github.sha }}
          path: work/artifacts
      - name: Include the APK built from this commit
        run: |
          cd work/artifacts
          sha256sum -c app-debug.apk.sha256
          cp app-debug.apk app-debug.apk.json app-debug.apk.sha256 ../../public/
      - run: npm ci
      - run: npm run build
      - name: Migrate, deploy and verify the canonical server
        run: npm run backend:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the published APK
        run: |
          node --input-type=module <<'JS_APK'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const deployment = JSON.parse(await readFile('work/backend/deployment.json', 'utf8'));
          const expected = JSON.parse(await readFile('public/app-debug.apk.json', 'utf8'));
          assert.equal(deployment.service, 'movement-test-api-staging');
          assert.equal(deployment.database, 'movement-test-app-staging');
          assert.equal(deployment.url, 'https://movement-test-api-staging.rojoscarlos93.workers.dev');
          const url = deployment.url + '/app-debug.apk';
          const query = '?sha256=' + expected.sha256;
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const metadata = await fetch(url + '.json' + query, {cache: 'no-store', signal: AbortSignal.timeout(15000)});
              assert.ok(metadata.ok, 'Public APK metadata failed: HTTP ' + metadata.status);
              const info = await metadata.json();
              for (const field of ['version', 'appId', 'size', 'sha256', 'signingCertificateSha256'])
                assert.equal(info[field], expected[field], 'Public APK metadata is not current: ' + field);
              const response = await fetch(url + query, {cache: 'no-store', signal: AbortSignal.timeout(60000)});
              assert.ok(response.ok, 'Public APK download failed: HTTP ' + response.status);
              const bytes = new Uint8Array(await response.arrayBuffer());
              assert.equal(bytes.length, expected.size);
              assert.equal(createHash('sha256').update(bytes).digest('hex'), expected.sha256);
              console.log('Verified public APK download:', url);
              console.log('APK SHA-256:', expected.sha256);
              break;
            } catch (error) {
              if (attempt === 7) throw error;
              console.log('Waiting for the published APK to become current; retry', attempt + 1);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }
          JS_APK
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: work/backend/deployment.json
  retire_legacy:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: server-identity-import
          path: work/server-consolidation
      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: work/backend
      - name: Back up the former Worker before retiring it
        run: node scripts/retire-legacy-worker.mjs --backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-worker-backup-${{ github.run_attempt }}
          path: work/server-consolidation/legacy-worker-backup/
          if-no-files-found: error
      - name: Retire only the former Worker and retain its database archive
        run: node scripts/retire-legacy-worker.mjs --retire
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-retirement-result
          path: work/server-consolidation/retirement.json
  publish_apk:
    needs: retire_legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: movement-android-${{ github.sha }}
          path: work/artifacts
      - name: Publish the verified APK in the single main branch
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          cd work/artifacts
          sha256sum -c app-debug.apk.sha256
          cd ../..
          node --input-type=module <<'JS_PACKAGE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          const apk=JSON.parse(await readFile('work/artifacts/app-debug.apk.json','utf8'));
          const signing=JSON.parse(await readFile('android/staging-signing.json','utf8'));
          assert.equal(pkg.version,'2.5.4');
          assert.equal(apk.version,pkg.version);
          assert.equal(apk.appId,signing.appId);
          assert.equal(apk.signingCertificateSha256,signing.certificateSha256);
          JS_PACKAGE
          cp work/artifacts/app-debug.apk work/artifacts/app-debug.apk.json work/artifacts/app-debug.apk.sha256 public/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app-debug.apk public/app-debug.apk.json public/app-debug.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish verified main APK 2.5.4 [skip ci]'
            git push origin HEAD:main
          fi

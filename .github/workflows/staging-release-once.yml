name: Movement — requested staging release 2.5.3

on:
  push:
    branches: [release/staging-2.5.3-20261023]
    paths: [.github/release-requests/staging-2.5.3-20261023.json]

permissions:
  contents: read

concurrency:
  group: movement-deploy-staging
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify the requested source and available credentials
        env:
          STAGING_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAGING_ANDROID_KEYSTORE_BASE64 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY_REQUEST'
          import json, os, subprocess
          source = '28528cbdc9fb125dc21a9f211e9d3b0fa5920f34'
          path = '.github/release-requests/staging-2.5.3-20261023.json'
          with open(path) as stream:
              request = json.load(stream)
          assert request['target'] == 'staging'
          assert request['sourceCommit'] == source
          assert request['version'] == '2.5.3'
          assert request['appId'] == 'com.movement.squat.staging.ui'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == source
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', source, 'HEAD'], text=True).splitlines())
          assert changed == {path, '.github/workflows/staging-release-once.yml'}, 'Application sources differ from the reviewed commit'
          missing = [name for name in ('STAGING_ANDROID_KEYSTORE_BASE64', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID') if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing Actions secrets: ' + ', '.join(missing))
          print('Reviewed source and three required secret bindings confirmed; values were not printed.')
          PY_REQUEST
  check:
    needs: authorize
    uses: ./.github/workflows/checks.yml
  android:
    needs: check
    uses: ./.github/workflows/android.yml
    secrets:
      STAGING_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAGING_ANDROID_KEYSTORE_BASE64 }}
  deploy:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository. See docs/CLOUDFLARE_SETUP.md.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: movement-android-${{ github.sha }}
          path: work/artifacts
      - name: Include the APK built from this commit
        run: |
          cd work/artifacts
          sha256sum -c app-debug.apk.sha256
          cp app-debug.apk app-debug.apk.json app-debug.apk.sha256 ../../public/
      - run: npm ci
      - run: npm run build
      - name: Migrate, deploy and verify the selected server
        run: npm run backend:deploy
        env:
          BACKEND_TARGET: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the published APK
        env:
          EXPECTED_TARGET: staging
        run: |
          node --input-type=module <<'JS_APK'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const deployment = JSON.parse(await readFile('work/backend/deployment.json', 'utf8'));
          const expected = JSON.parse(await readFile('public/app-debug.apk.json', 'utf8'));
          assert.equal(deployment.target, process.env.EXPECTED_TARGET);
          const worker = deployment.target === 'staging' ? 'movement-test-api-staging' : 'movement-test-api';
          assert.match(deployment.url, new RegExp('^https://' + worker + '\\.[a-z0-9-]+\\.workers\\.dev$'));
          const url = deployment.url + '/app-debug.apk';
          const query = '?sha256=' + expected.sha256;
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const metadata = await fetch(url + '.json' + query, {cache: 'no-store', signal: AbortSignal.timeout(15000)});
              assert.ok(metadata.ok, 'Public APK metadata failed: HTTP ' + metadata.status);
              const info = await metadata.json();
              for (const field of ['version', 'appId', 'size', 'sha256', 'signingCertificateSha256'])
                assert.equal(info[field], expected[field], 'Public APK metadata is not current: ' + field);
              const response = await fetch(url + query, {cache: 'no-store', signal: AbortSignal.timeout(60000)});
              assert.ok(response.ok, 'Public APK download failed: HTTP ' + response.status);
              const bytes = new Uint8Array(await response.arrayBuffer());
              assert.equal(bytes.length, expected.size);
              assert.equal(createHash('sha256').update(bytes).digest('hex'), expected.sha256);
              console.log('Verified public APK download:', url);
              console.log('APK SHA-256:', expected.sha256);
              break;
            } catch (error) {
              if (attempt === 7) throw error;
              console.log('Waiting for the published APK to become current; retry', attempt + 1);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }
          JS_APK
      - uses: actions/upload-artifact@v4
        with:
          name: backend-staging-${{ github.sha }}
          path: work/backend/deployment.json

name: Movement — server inventory before consolidation
on:
  push:
    branches: [codex/unify-server-main]
    paths: [.github/release-requests/server-inventory-20261023.json]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read aggregate data and worker bindings without changing servers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS_INVENTORY'
          import {mkdir,writeFile} from 'node:fs/promises';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw new Error('Cloudflare secrets are missing.');
          async function api(path,body){
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});
            const value=await response.json();
            if(!response.ok||!value.success)throw new Error(`Cloudflare HTTP ${response.status}, codes ${(value.errors||[]).map(e=>e.code).join(',')}`);
            return value.result;
          }
          const all=await api('/d1/database?per_page=100');
          const names=['movement-test-app','movement-test-app-staging'];
          const databases=[];
          for(const name of names){
            const found=all.filter(db=>db.name===name);
            if(found.length!==1)throw new Error(`Expected one database named ${name}; found ${found.length}`);
            const db=found[0];
            async function query(sql){const result=await api(`/d1/database/${db.uuid}/query`,{sql});return result[0]?.results||[];}
            const tables=(await query("SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name")).map(row=>row.name);
            const counts={};
            for(const table of tables){if(!/^[a-zA-Z0-9_]+$/.test(table))continue;counts[table]=(await query(`SELECT COUNT(*) AS n FROM "${table}"`))[0].n;}
            const info={name,counts};
            if(tables.includes('device_sessions'))info.activeSessions=(await query('SELECT COUNT(*) AS n FROM device_sessions WHERE revoked_at IS NULL'))[0].n;
            if(tables.includes('rounds'))info.roundStatuses=await query('SELECT status,COUNT(*) AS n FROM rounds GROUP BY status');
            if(tables.includes('repetition_events')){
              const columns=await query('PRAGMA table_info(repetition_events)');
              if(columns.some(c=>c.name==='received_at'))info.latestEventReceivedAt=(await query('SELECT MAX(received_at) AS value FROM repetition_events'))[0]?.value;
            }
            if(tables.includes('d1_migrations'))info.migrations=(await query('SELECT name FROM d1_migrations ORDER BY id')).map(v=>v.name);
            databases.push(info);
          }
          const workers=[];
          const scripts=await api('/workers/scripts');
          for(const name of ['movement-test-api','movement-test-api-staging']){
            const script=scripts.find(s=>s.id===name);
            if(!script){workers.push({name,present:false});continue;}
            const settings=await api(`/workers/scripts/${name}/settings`);
            let health;
            try {const r=await fetch(`https://${name}.rojoscarlos93.workers.dev/api/health`,{signal:AbortSignal.timeout(15000)});const h=await r.json();health={status:r.status,version:h.version,authentication:h.authentication};}catch{health={unavailable:true};}
            workers.push({name,present:true,databases:(settings.bindings||[]).filter(v=>v.type==='d1').map(v=>({binding:v.name,database:all.find(db=>db.uuid===(v.id||v.database_id))?.name||'unknown'})),health});
          }
          const report={readOnly:true,at:new Date().toISOString(),databases,workers};
          await mkdir('work/server-consolidation',{recursive:true});
          await writeFile('work/server-consolidation/inventory.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          JS_INVENTORY
      - uses: actions/upload-artifact@v4
        with:
          name: server-inventory
          path: work/server-consolidation/inventory.json

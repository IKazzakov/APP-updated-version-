name: Movement — checks and APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build a signed APK after all checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: movement-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    uses: ./.github/workflows/checks.yml
  android:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_apk)
    uses: ./.github/workflows/android.yml
    secrets:
      STAGING_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAGING_ANDROID_KEYSTORE_BASE64 }}

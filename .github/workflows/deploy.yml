name: Movement — manual deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter deploy to publish the canonical server from main'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: movement-deploy
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check the explicit deployment request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$CONFIRMATION" = deploy || { echo '::error::Enter deploy to confirm publication.'; exit 1; }
          if [ "$SOURCE_REF" != refs/heads/main ]; then
            echo '::error::The canonical server must be deployed from main.'
            exit 1
          fi

  preflight:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture the existing D1 recovery point and Worker version
        run: node --use-env-proxy scripts/release-checkpoint.mjs before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.sha }}
          if-no-files-found: error
          path: work/backend/preflight.json
  check:
    needs: preflight
    uses: ./.github/workflows/checks.yml
  android:
    needs: check
    uses: ./.github/workflows/android.yml
    secrets:
      STAGING_ANDROID_KEYSTORE_BASE64: ${{ secrets.STAGING_ANDROID_KEYSTORE_BASE64 }}
  deploy:
    needs: [android, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository. See docs/CLOUDFLARE_SETUP.md.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: movement-android-${{ github.sha }}
          path: work/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: preflight-${{ github.sha }}
          path: work/backend
      - run: npm ci
      - name: Capture clean source metadata before adding release downloads
        run: |
          node --input-type=module <<'JS_BUILD'
          import assert from 'node:assert/strict';
          import {appendFile,readFile} from 'node:fs/promises';
          import {buildMetadata} from './scripts/build.mjs';
          const build=buildMetadata(process.cwd(),{release:true,inherited:null});
          const apk=JSON.parse(await readFile('work/artifacts/app-debug.apk.json','utf8'));
          for(const field of ['version','versionCode','sourceSha','dirty']) assert.equal(apk[field],build[field]);
          await appendFile(process.env.GITHUB_ENV,'MOVEMENT_BUILD_METADATA='+JSON.stringify(build)+'\n');
          JS_BUILD
      - name: Include the APK built from this commit
        run: |
          cd work/artifacts
          sha256sum -c app-debug.apk.sha256
          cp app-debug.apk app-debug.apk.json app-debug.apk.sha256 ../../public/
      - run: npm run build
      - name: Migrate, deploy and verify the canonical server
        run: npm run backend:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify migration journal, preserved data and published version
        run: node --use-env-proxy scripts/release-checkpoint.mjs after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the published APK
        run: |
          node --input-type=module <<'JS_APK'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const deployment = JSON.parse(await readFile('work/backend/deployment.json', 'utf8'));
          const expected = JSON.parse(await readFile('public/app-debug.apk.json', 'utf8'));
          assert.equal(deployment.service, 'movement-test-api-staging');
          assert.equal(deployment.database, 'movement-test-app-staging');
          assert.equal(deployment.url, 'https://movement-test-api-staging.rojoscarlos93.workers.dev');
          const url = deployment.url + '/app-debug.apk';
          const query = '?sha256=' + expected.sha256;
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const metadata = await fetch(url + '.json' + query, {cache: 'no-store', signal: AbortSignal.timeout(15000)});
              assert.ok(metadata.ok, 'Public APK metadata failed: HTTP ' + metadata.status);
              const info = await metadata.json();
              for (const field of ['version', 'appId', 'size', 'sha256', 'signingCertificateSha256'])
                assert.equal(info[field], expected[field], 'Public APK metadata is not current: ' + field);
              const response = await fetch(url + query, {cache: 'no-store', signal: AbortSignal.timeout(60000)});
              assert.ok(response.ok, 'Public APK download failed: HTTP ' + response.status);
              const bytes = new Uint8Array(await response.arrayBuffer());
              assert.equal(bytes.length, expected.size);
              assert.equal(createHash('sha256').update(bytes).digest('hex'), expected.sha256);
              console.log('Verified public APK download:', url);
              console.log('APK SHA-256:', expected.sha256);
              break;
            } catch (error) {
              if (attempt === 7) throw error;
              console.log('Waiting for the published APK to become current; retry', attempt + 1);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }
          JS_APK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ github.sha }}
          path: |
            work/backend/deployment.json
            work/backend/preflight.json
            work/backend/postflight.json

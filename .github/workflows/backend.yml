name: Backend — checks and deployment
on:
  push:
    branches: [codex/backend-hosting-2.5.1]
  pull_request:
    branches: [main, codex/build-android-apk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: movement-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run backend:validate
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/backend-hosting-2.5.1'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. See docs/CLOUDFLARE_SETUP.md.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Provision D1, migrate, deploy and verify
        run: npm run backend:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-deployment
          path: work/backend/deployment.json

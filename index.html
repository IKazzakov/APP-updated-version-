<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Движение" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta
      name="description"
      content="Приседания с камерой: дневное задание, дружеские соревнования и личный прогресс."
    />
    <title>Движение · Счётчик приседаний</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Движение, главная">
          <span class="brand-icon">
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M6 18 18 6M6 6h12v12"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg> </span
          >движение<span class="brand-dot">.</span>
        </a>
        <button id="profile-toggle" class="profile-button" aria-expanded="false">
          Мой профиль
        </button>
      </header>
      <div
        data-profile="panel"
        data-feature="profile"
        data-feature="profile"
        data-feature="profile"
        style="display: contents"
      ></div>
      <div id="connection" class="connection" role="status" aria-live="polite">
        Загружаем ваш прогресс…
      </div>
      <div id="app-error" class="error-box" role="alert" hidden></div>
      <div
        data-profile="auth"
        data-feature="profile"
        data-feature="profile"
        data-feature="profile"
        style="display: contents"
      ></div>
      <nav class="main-nav" aria-label="Основные разделы"></nav>
      <main id="screens"></main>
      <footer>
        <p>
          Видео и точки тела обрабатываются на устройстве. На сервере — только профиль, числа
          повторений, задания и раунды.
        </p>
        <span data-app-version>ДВИЖЕНИЕ</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
